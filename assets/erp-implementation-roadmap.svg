<svg xmlns="http://www.w3.org/2000/svg" width="900" height="324" viewBox="0 0 900 324" role="img"><title>ERP implementation roadmap: six stages from Discovery to Go-Live and Improvement</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#382B43"/></linearGradient></defs><rect x="0" y="0" width="900" height="324" rx="16" fill="url(#bg)" stroke="none"/><rect x="14" y="15" width="278" height="135" rx="12" fill="#263045" stroke="#465068"/><rect x="26" y="27" width="37" height="28" rx="7" fill="#C6A1DE" stroke="none"/><text x="34" y="46" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172033">01</text><text x="26" y="80" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Discovery</text><text x="26" y="107" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">Understand business goals, pain</text><text x="26" y="127" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">points and operational challenges.</text><rect x="311" y="15" width="278" height="135" rx="12" fill="#263045" stroke="#465068"/><rect x="323" y="27" width="37" height="28" rx="7" fill="#C6A1DE" stroke="none"/><text x="331" y="46" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172033">02</text><text x="323" y="80" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Requirements Analysis</text><text x="323" y="107" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">Gather, organize and document</text><text x="323" y="127" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">business and functional requirements.</text><rect x="608" y="15" width="278" height="135" rx="12" fill="#263045" stroke="#465068"/><rect x="620" y="27" width="37" height="28" rx="7" fill="#78CFC8" stroke="none"/><text x="628" y="46" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172033">03</text><text x="620" y="80" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Process Mapping</text><text x="620" y="107" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">Analyze current workflows and</text><text x="620" y="127" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">define improved future processes.</text><rect x="608" y="174" width="278" height="135" rx="12" fill="#263045" stroke="#465068"/><rect x="620" y="186" width="37" height="28" rx="7" fill="#78CFC8" stroke="none"/><text x="628" y="205" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172033">04</text><text x="620" y="239" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Solution Design</text><text x="620" y="266" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">Align requirements with suitable</text><text x="620" y="286" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">Odoo ERP workflows and modules.</text><rect x="311" y="174" width="278" height="135" rx="12" fill="#263045" stroke="#465068"/><rect x="323" y="186" width="37" height="28" rx="7" fill="#A9B9F5" stroke="none"/><text x="331" y="205" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172033">05</text><text x="323" y="239" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Validation &amp; Training</text><text x="323" y="266" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">Review solution flows, support</text><text x="323" y="286" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">UAT and help users adapt.</text><rect x="14" y="174" width="278" height="135" rx="12" fill="#263045" stroke="#465068"/><rect x="26" y="186" width="37" height="28" rx="7" fill="#A9B9F5" stroke="none"/><text x="34" y="205" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#172033">06</text><text x="26" y="239" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Go-Live &amp; Improvement</text><text x="26" y="266" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">Support deployment, adoption and</text><text x="26" y="286" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="400" fill="#C7CEDC">continuous business improvement.</text><path d="M294 82 H308 m-5 -5 5 5 -5 5" fill="none" stroke="#C6A1DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M591 82 H605 m-5 -5 5 5 -5 5" fill="none" stroke="#C6A1DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M747 151 V171 m-5 -5 5 5 5 -5" fill="none" stroke="#C6A1DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M606 241 H592 m5 -5 -5 5 5 5" fill="none" stroke="#C6A1DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M309 241 H295 m5 -5 -5 5 5 5" fill="none" stroke="#C6A1DE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>